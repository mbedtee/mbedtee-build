# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron:  '00 5,18 * * *'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  # Job A: vexpress + mips platforms (smaller buildroot clone)
  build-vexpress-mips:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download buildroot
        run: ./buildroot.sh buildroot-vexpress-mips

      - name: Build mbedtee_vexpress_ca78
        run: |
          cd buildroot-vexpress-mips && make clean && make mbedtee_vexpress_ca78_defconfig && make
      - name: Upload Artifact - mbedtee_vexpress_ca78
        uses: actions/upload-artifact@v4
        with:
          name: mbedtee_vexpress_ca78
          path: buildroot-vexpress-mips/output/images

      - name: Build mbedtee_vexpress_ca15
